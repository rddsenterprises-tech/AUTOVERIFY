<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Enter your contact and vehicle details for your AutoVerify report request.">
<title>AutoVerify | Customer Details</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#172033;font-family:"DM Sans",Arial,sans-serif}
h1,h2{font-family:Manrope,"DM Sans",sans-serif}
.page{width:min(100%,980px);margin:0 auto;padding:34px 40px 40px}
.form-shell{border:1px solid #aeb2b8;border-radius:11px;padding:36px 40px 39px;min-height:620px}
.form-title{font-size:22px;font-weight:600;color:#39465a;margin:0 0 8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field-wrap{min-width:0}
.field-wrap.full{grid-column:1/-1}
label.field-label{display:block;font-size:11px;font-weight:500;color:#18243a;margin-bottom:4px}
.required{color:#ef4444;font-weight:700}
input,select{width:100%;height:27px;border:1px solid #788394;border-radius:2px;background:#fff;padding:3px 8px;color:#172033;font:12px "DM Sans",sans-serif;outline:none}
input:focus,select:focus{border-color:#2456d8;box-shadow:0 0 0 2px #2456d81a}
select{height:28px;color:#657084}
.terms-title{font-size:11px;color:#172033;margin:17px 0 4px}
.consent{display:flex;align-items:flex-start;gap:5px;margin:7px 0;font-size:10.5px;line-height:1.45;color:#172033}
.consent input{width:12px;height:12px;flex:0 0 12px;margin:1px 0 0;padding:0}
.send-btn{margin-top:9px;width:124px;height:27px;border:0;border-radius:2px;background:#2856d9;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.send-btn:hover{background:#1946c4}
.status{display:none;margin-top:12px;padding:10px 12px;border-radius:5px;font-size:12px;line-height:1.5}
.status.show{display:block}
.status.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.status.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
@media(max-width:640px){.page{padding:14px}.form-shell{padding:23px 17px 28px;min-height:0}.fields{grid-template-columns:1fr;gap:11px}.field-wrap.full{grid-column:auto}.form-title{font-size:21px}.consent{font-size:11px;line-height:1.5}}
</style>
</head>
<body>
<main class="page">
<section class="form-shell" aria-labelledby="formTitle">
<h1 id="formTitle" class="form-title">Silver</h1>
<form id="detailsForm" novalidate>
<div class="fields">
<div class="field-wrap">
<label class="field-label" for="fullName">Full Name <span class="required">*</span></label>
<input id="fullName" name="fullName" autocomplete="name" required>
</div>
<div class="field-wrap">
<label class="field-label" for="phone">Phone <span class="required">*</span></label>
<input id="phone" name="phone" type="tel" autocomplete="tel" required>
</div>
<div class="field-wrap">
<label class="field-label" for="email">Email <span class="required">*</span></label>
<input id="email" name="email" type="email" autocomplete="email" required>
</div>
<div class="field-wrap">
<label class="field-label" for="street">Street Address <span class="required">*</span></label>
<input id="street" name="street" autocomplete="street-address" required>
</div>
<div class="field-wrap">
<label class="field-label" for="city">City <span class="required">*</span></label>
<input id="city" name="city" autocomplete="address-level2" required>
</div>
<div class="field-wrap">
<label class="field-label" for="state">State <span class="required">*</span></label>
<input id="state" name="state" autocomplete="address-level1" required>
</div>
<div class="field-wrap">
<label class="field-label" for="country">Country <span class="required">*</span></label>
<input id="country" name="country" autocomplete="country-name" required>
</div>
<div class="field-wrap">
<label class="field-label" for="zip">ZIP Code <span class="required">*</span></label>
<input id="zip" name="zip" autocomplete="postal-code" required>
</div>
<div class="field-wrap full">
<label class="field-label" for="vin">VIN/HIN <span class="required">*</span></label>
<input id="vin" name="vin" autocomplete="off" maxlength="32" required>
</div>
<div class="field-wrap full">
<label class="field-label" for="package">Select Package <span class="required">*</span></label>
<select id="package" name="package" required>
<option value="Silver">Silver - $47.99</option>
<option value="Gold">Gold - $68.99</option>
<option value="Platinum">Platinum - $89.99</option>
</select>
</div>
</div>
<p class="terms-title">Terms &amp; conditions</p>
<label class="consent"><input type="checkbox" name="accuracy" required><span>Accuracy of Information: By submitting this form, you confirm that all the information provided is accurate and complete to the best of your knowledge.</span></label>
<label class="consent"><input type="checkbox" name="dataConsent" required><span>Data Usage Consent: The information collected through this form will be used solely for the purpose of processing your vehicle history report request and providing related services. Your data will be handled in accordance with our Privacy Policy.</span></label>
<label class="consent"><input type="checkbox" name="disclaimer" required><span>Service Disclaimer: AutoVerify does not guarantee the availability or accuracy of vehicle history data, as it depends on third-party sources. By submitting this form, you acknowledge that reports may contain discrepancies or incomplete information.</span></label>
<button class="send-btn" type="submit">Send</button>
<p id="formStatus" class="status" role="status" aria-live="polite"></p>
</form>
</section>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const prices={Silver:"47.99",Gold:"68.99",Platinum:"89.99"};
 const packageSelect=document.getElementById("package");
 const storedPackage=sessionStorage.getItem("autoverify_package")||params.get("package")||"Silver";
 const validPackage=Object.prototype.hasOwnProperty.call(prices,storedPackage)?storedPackage:"Silver";
 packageSelect.value=validPackage;
 function syncPackage(){
   const selected=packageSelect.value;
   document.getElementById("formTitle").textContent=selected;
   try{
     sessionStorage.setItem("autoverify_package",selected);
     sessionStorage.setItem("autoverify_price",prices[selected]);
   }catch(_){}
 }
 packageSelect.addEventListener("change",syncPackage);
 syncPackage();
 const vin=sessionStorage.getItem("autoverify_vin")||params.get("vin")||"";
 document.getElementById("vin").value=vin;
 document.getElementById("detailsForm").addEventListener("submit",function(event){
   event.preventDefault();
   const form=event.currentTarget;
   const status=document.getElementById("formStatus");
   if(!form.reportValidity()){
     status.textContent="Please complete all required fields and accept all three terms before continuing.";
     status.className="status show error";
     return;
   }
   status.textContent="Your details form is ready, but online submission is not active yet. No information has been sent or stored. Please contact AutoVerify to continue.";
   status.className="status show info";
 });
})();
</script>
</body>
</html>
